services:  
  db:
    image: postgres:15-alpine
    container_name: nexa_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexa_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      target: build
    container_name: nexa_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-nexa_user}
      DB_PASS: ${DB_PASS:-nexa_password}
      DB_NAME: ${DB_NAME:-nexa_db}
      JWT_SECRET: ${JWT_SECRET:-nexa_dev_jwt_secret}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

    volumes:
      - ./backend:/app             # 👈 O Túnel: conecta seu Linux Mint ao Container
      - /app/node_modules          # 👈 Mantém as bibliotecas isoladas
      - ./backend/uploads:/app/uploads # 👈 Isso garante que o PDF apareça na sua pasta local
    command: npx ts-node-dev --respawn --transpile-only src/index.ts # 👈 Faz atualizar ao salvar

  frontend:  
    build: ./frontend
    container_name: nexa_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
